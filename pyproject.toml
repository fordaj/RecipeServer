[project]
name = "recipeserver"
dynamic = ["version"]
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "fordaj", email = "6288298+fordaj@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
  "beautifulsoup4>=4.15.0",
  "cairosvg>=2.9.1",
  "coloraide>=8.13.1",
  "loguru>=0.7.3",
  "markdown>=3.11",
  "pillow==12.3.0",
  "platformdirs>=4.13.0",
  "py7zr>=1.1.4",
  "pymdown-extensions>=12.1",
  "pystray>=0.19.5",
  "python-frontmatter>=1.3.0",
  "python-slugify>=9.1.2",
]

[project.scripts]
recipeserver = "recipeserver:main"

[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
version_file = "src/recipeserver/_version.py"

[dependency-groups]
dev = ["black>=24.0", "formattington", "pytest>=9.1.1"]

[tool.uv.sources]
formattington = { git = "https://github.com/fordaj/formattington.git" }

[tool.black]
line-length = 150
