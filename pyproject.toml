[project]
name = "recipeserver"
dynamic = ["version"]
description = "Add your description here"
readme = "README.md"
authors = [
  { name = "fordaj", email = "6288298+fordaj@users.noreply.github.com" },
]
requires-python = ">=3.14"
dependencies = [
  "beautifulsoup4>=4.15.0",
  "coloraide>=8.13.1",
  "faster-whisper>=1.2.1",
  "loguru>=0.7.3",
  "markdown>=3.11",
  "pillow==12.3.0",
  "platformdirs>=4.13.0",
  "py7zr>=1.1.4",
  "pymdown-extensions>=12.1",
  "pystray>=0.19.5",
  "python-frontmatter>=1.3.0",
]

[project.scripts]
recipeserver = "recipeserver:main"

[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

# The version is derived from git tags (dynamic = ["version"]). The table must
# exist for setuptools-scm's hook to run. There is intentionally no
# version_file: the previous version_file pointed at
# src/recipeserver/_version.py and overwrote the hand-written module on every
# build, breaking `from ._version import PACKAGE_VERSION`. The package reads
# its version at runtime from the installed metadata (see _version.py).
[tool.setuptools_scm]

[dependency-groups]
dev = ["black>=24.0", "formattington", "pytest>=9.1.1", "selenium>=4.30"]

[tool.uv.sources]
# Pinned to a commit that supports the Go toolchain reliance.
formattington = { git = "https://github.com/fordaj/formattington.git", rev = "dbed7479da27bd9908fbd7e39c66cb84ab7d7aab" }

[tool.black]
line-length = 150
