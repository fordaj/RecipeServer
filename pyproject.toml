[project]
name = "recipeserver"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "fordaj", email = "andy@ford-network.com" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "loguru>=0.7.3",
    "markdown>=3.11",
    "pillow==12.3.0",
    "platformdirs>=4.13.0",
    "pymdown-extensions>=12.1",
    "pystray>=0.19.5",
    "python-frontmatter>=1.3.0",
    "python-slugify>=9.1.2",
    "watchdog>=6.0.0",
]

[project.scripts]
recipeserver = "recipeserver:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
