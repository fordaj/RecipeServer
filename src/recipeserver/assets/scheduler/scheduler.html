<div class="scheduler">
  <header class="scheduler__header">
    <h2 class="scheduler__title">Scheduler</h2>

    <div class="view-switcher" role="group" aria-label="Scheduler view">
      <button type="button" data-scheduler-view="day" aria-pressed="true">Day</button>
      <button type="button" data-scheduler-view="week" aria-pressed="false">Week</button>
      <button type="button" data-scheduler-view="month" aria-pressed="false">Month</button>
    </div>

    <button type="button" class="scheduler__close" aria-label="Close scheduler">&times;</button>
  </header>

  <div class="scheduler__toolbar">
    <button type="button" class="scheduler__today">Today</button>
    <h3 class="scheduler__period" aria-live="polite"></h3>

    <button type="button" class="scheduler__select" aria-pressed="false">
      <span data-scheduler-select-label>Select</span>
    </button>
  </div>

  <p class="scheduler__status" role="status"></p>

  <section class="scheduler__content" aria-label="Scheduled recipes">
    <div class="scheduler__scroll">
      <div class="scheduler__weekdays" hidden>
        <span>Sun</span>
        <span>Mon</span>
        <span>Tue</span>
        <span>Wed</span>
        <span>Thu</span>
        <span>Fri</span>
        <span>Sat</span>
      </div>
    </div>
  </section>

  <footer class="scheduler__footer">
    <p class="scheduler__selection" aria-live="polite"></p>

    <button type="button" class="scheduler__shopping" hidden disabled>
      <span class="scheduler__icon" aria-hidden="true"></span>
      <span>Open in Shopping List</span>
    </button>

    <label class="scheduler__field">
      <span class="scheduler__label">Date</span>
      <input class="scheduler__date" type="date" />
    </label>

    <button type="button" class="scheduler__schedule">Schedule</button>
  </footer>
</div>
