<form class="meal-planner" method="dialog">
  <header class="meal-planner__header">
    <h2>Meal Planner</h2>
    <button type="button" class="meal-planner__close" aria-label="Close meal planner">
      &times;
    </button>
  </header>

  <div class="meal-planner__body">
    <p class="meal-planner__status" role="status"></p>

    <section class="meal-planner__recipes" aria-label="Selected recipes">
      <div class="meal-planner__recipe meal-planner__recipe--header">
        <span>Scale</span>
        <span>Image</span>
        <span>Recipe</span>
      </div>
    </section>

    <section class="meal-planner__combined" aria-labelledby="meal-planner-combined-heading">
      <h3 id="meal-planner-combined-heading">Combined Ingredients</h3>
      <ul class="task-list meal-planner__ingredients"></ul>
    </section>
  </div>

  <footer class="meal-planner__footer">
    <button type="button" class="meal-planner__copy">Copy Markdown</button>
    <button type="button" class="meal-planner__print">Print / PDF</button>
    <button type="submit" class="meal-planner__done">Done</button>
  </footer>
</form>
