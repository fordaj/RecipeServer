<form class="meal-planner" method="dialog">
  <header class="meal-planner__header">
    <h2>Meal Planner</h2>
    <button type="button" class="meal-planner__close" aria-label="Close meal planner">
      &times;
    </button>
  </header>

  <p class="meal-planner__status" role="status"></p>

  <section class="meal-planner__recipes" aria-label="Selected recipes"></section>

  <section class="meal-planner__combined">
    <h3>Combined Ingredients</h3>
    <ul class="task-list meal-planner__ingredients"></ul>
  </section>

  <footer class="meal-planner__footer">
    <button type="button" class="meal-planner__print">Print</button>
    <button type="submit" class="meal-planner__done">Done</button>
  </footer>
</form>
