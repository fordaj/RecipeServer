<details class="recipe-editor__details recipe-editor__ratings-details" hidden>
  <summary>Ratings</summary>
  <fieldset
    class="recipe-editor__metadata recipe-editor__bulk-rating"
    data-field-group="ratings"
  ></fieldset>
  <p class="recipe-editor__bulk-help">
    Saving adds this named rating to every selected recipe, overriding any existing rating with the
    same name. Use the Save button inside the rating field to save only the rating.
  </p>
</details>
