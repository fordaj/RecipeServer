<details class="recipe-editor__details recipe-editor__ai-details">
  <summary>Auto-Generate</summary>

  <fieldset class="recipe-editor__section recipe-editor__ai">
    <h3>Create from source</h3>
    <p class="recipe-editor__ai-status" role="status" aria-live="polite"></p>

    <button type="button" class="recipe-editor__ai-cancel" hidden>Cancel generation</button>

    <div class="recipe-editor__ai-progress" hidden>
      <dl class="recipe-editor__ai-metrics" hidden>
        <div class="recipe-editor__ai-metric">
          <dt>Model load</dt>
          <dd class="recipe-editor__ai-metric-model-load"></dd>
        </div>
        <div class="recipe-editor__ai-metric">
          <dt>Generation</dt>
          <dd class="recipe-editor__ai-metric-generation"></dd>
        </div>
        <div class="recipe-editor__ai-metric">
          <dt>Tokens</dt>
          <dd class="recipe-editor__ai-metric-tokens"></dd>
        </div>
        <div class="recipe-editor__ai-metric">
          <dt>Speed</dt>
          <dd class="recipe-editor__ai-metric-rate"></dd>
        </div>
      </dl>
    </div>

    <div class="recipe-editor__ai-field">
      <label for="recipe-editor-ai-text">From text</label>
      <textarea
        id="recipe-editor-ai-text"
        class="recipe-editor__ai-text"
        rows="5"
        placeholder="Paste recipe text here"
      ></textarea>
      <button type="button" class="recipe-editor__ai-generate-text">Generate from text</button>
    </div>

    <div class="recipe-editor__ai-field">
      <label for="recipe-editor-ai-url">From URL</label>
      <input
        id="recipe-editor-ai-url"
        type="url"
        class="recipe-editor__ai-url"
        placeholder="https://example.com/recipe"
      />
      <button type="button" class="recipe-editor__ai-generate-url">Generate from URL</button>
    </div>

    <div class="recipe-editor__ai-field">
      <label for="recipe-editor-ai-image">From Image</label>
      <input
        id="recipe-editor-ai-image"
        type="file"
        class="recipe-editor__ai-image"
        accept=".jpg,.jpeg,.png,.gif,.webp,.bmp,.tiff,.tif"
      />
      <button type="button" class="recipe-editor__ai-generate-image">Generate from image</button>
    </div>
  </fieldset>
</details>
