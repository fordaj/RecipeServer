<details class="recipe-editor__details">
  <summary>Sources</summary>

  <fieldset class="recipe-editor__metadata">
    <label>
      Source Author
      <span class="recipe-editor__mixed" hidden>* MIXED</span>
      <span class="recipe-editor__field-control">
        <input name="source.author" type="text" placeholder="First Last" />
        <button
          type="button"
          class="recipe-editor__bulk-field-save"
          data-field="source"
          aria-label="Save source to all selected recipes"
          hidden
        >
          Save
        </button>
      </span>
    </label>

    <label>
      Source Title
      <span class="recipe-editor__mixed" hidden>* MIXED</span>
      <span class="recipe-editor__field-control">
        <input
          name="source.title"
          type="text"
          placeholder="Book Title, Website Name, AI Model, etc."
        />
        <button
          type="button"
          class="recipe-editor__bulk-field-save"
          data-field="source"
          aria-label="Save source to all selected recipes"
          hidden
        >
          Save
        </button>
      </span>
    </label>

    <label>
      Source Format
      <span class="recipe-editor__mixed" hidden>* MIXED</span>
      <span class="recipe-editor__field-control">
        <select name="source.format">
          <option value="">Select format</option>
          <option value="Website">Website</option>
          <option value="AI">AI</option>
          <option value="Book">Book</option>
          <option value="Other">Other</option>
        </select>
        <button
          type="button"
          class="recipe-editor__bulk-field-save"
          data-field="source"
          aria-label="Save source to all selected recipes"
          hidden
        >
          Save
        </button>
      </span>
    </label>

    <label>
      Source URL
      <span class="recipe-editor__mixed" hidden>* MIXED</span>
      <span class="recipe-editor__field-control">
        <input name="source.url" type="url" placeholder="https://example.com" />
        <button
          type="button"
          class="recipe-editor__bulk-field-save"
          data-field="source"
          aria-label="Save source to all selected recipes"
          hidden
        >
          Save
        </button>
      </span>
    </label>
  </fieldset>
</details>
