<details class="recipe-editor__details">
  <summary>Files</summary>

  <fieldset class="recipe-editor__section">
    <div class="recipe-editor__location" hidden>
      <label>
        Folder
        <select class="recipe-editor__folder-mode" aria-label="Folder location">
          <option value="title">Use recipe title (recommended)</option>
          <option value="existing">Existing folder</option>
          <option value="new">New folder</option>
        </select>
      </label>
      <label class="recipe-editor__existing-folder">
        Choose folder
        <select class="recipe-editor__folder-select"></select>
      </label>
      <label class="recipe-editor__folder-path" hidden>
        New folder path
        <input type="text" class="recipe-editor__new-folder" placeholder="Desserts/Chocolate" />
      </label>
    </div>

    <div class="recipe-editor__images">
      <label for="recipe-editor-images">Recipe images</label>
      <input
        id="recipe-editor-images"
        type="file"
        multiple
        accept=".jpg,.jpeg,.png,.gif,.webp,.bmp,.tiff,.tif,.svg,.avif"
      />
      <img class="recipe-editor__images-preview" alt="" hidden />
      <p class="recipe-editor__images-caption" aria-live="polite"></p>
      <p class="recipe-editor__images-help">
        Drag &amp; drop images here, paste them from your clipboard, or click to choose files.
        Images are saved beside the recipe. Up to 20 files and 25 MB per save.
      </p>
      <p class="recipe-editor__images-selected" aria-live="polite"></p>
    </div>

    <!-- Deliberately outside the .recipe-editor__images dropzone: clicks
         here must not fall through to the dropzone's file picker. -->
    <div class="recipe-editor__find-image-row">
      <div class="recipe-editor__find-image-field">
        <label for="recipe-editor-find-image-query">Find image search</label>
        <input
          id="recipe-editor-find-image-query"
          class="recipe-editor__find-image-query"
          type="text"
          placeholder="e.g. chocolate brownies"
          autocomplete="off"
        />
      </div>
      <button
        id="recipe-editor-find-image"
        class="recipe-editor__find-image"
        type="button"
        aria-label="Find an image for me"
        title="Find an image for me"
      >
        <img src="/assets/ai.svg" alt="" aria-hidden="true" width="18" height="18" />
        <span>Find an image for me</span>
      </button>
    </div>
    <p class="recipe-editor__find-image-status" role="status"></p>
  </fieldset>
</details>
