<details class="recipe-editor__details">
  <summary>Details</summary>

  <fieldset class="recipe-editor__metadata">
    <label>
      Contributor
      <span class="recipe-editor__mixed" hidden>* MIXED</span>
      <span class="recipe-editor__field-control">
        <input name="contributor" type="text" placeholder="Andy Ford" />
        <button
          type="button"
          class="recipe-editor__bulk-field-save"
          data-field="contributor"
          aria-label="Save contributor to all selected recipes"
          hidden
        >
          Save
        </button>
      </span>
    </label>

    <label>
      Contribution Date
      <span class="recipe-editor__mixed" hidden>* MIXED</span>
      <span class="recipe-editor__field-control">
        <input name="createdOn" type="date" />
        <button
          type="button"
          class="recipe-editor__bulk-field-save"
          data-field="createdOn"
          aria-label="Save contribution date to all selected recipes"
          hidden
        >
          Save
        </button>
      </span>
    </label>

    <label>
      Meals
      <span class="recipe-editor__mixed" hidden>* MIXED</span>
      <span class="recipe-editor__field-control">
        <input name="meals" type="text" placeholder="ex. Breakfast, Dessert" />
        <button
          type="button"
          class="recipe-editor__bulk-field-save"
          data-field="meals"
          aria-label="Save meals to all selected recipes"
          hidden
        >
          Save
        </button>
      </span>
    </label>

    <label>
      Categories
      <span class="recipe-editor__mixed" hidden>* MIXED</span>
      <span class="recipe-editor__field-control">
        <input name="categories" type="text" placeholder="ex. Slow Cooker, Meat" />
        <button
          type="button"
          class="recipe-editor__bulk-field-save"
          data-field="categories"
          aria-label="Save categories to all selected recipes"
          hidden
        >
          Save
        </button>
      </span>
    </label>

    <label>
      Cuisine
      <span class="recipe-editor__mixed" hidden>* MIXED</span>
      <span class="recipe-editor__field-control">
        <input name="cuisine" type="text" placeholder="American" />
        <button
          type="button"
          class="recipe-editor__bulk-field-save"
          data-field="cuisine"
          aria-label="Save cuisine to all selected recipes"
          hidden
        >
          Save
        </button>
      </span>
    </label>

    <label>
      Status
      <span class="recipe-editor__mixed" hidden>* MIXED</span>
      <span class="recipe-editor__field-control">
        <input name="status" type="text" placeholder="In Rotation, Try Me" />
        <button
          type="button"
          class="recipe-editor__bulk-field-save"
          data-field="status"
          aria-label="Save status to all selected recipes"
          hidden
        >
          Save
        </button>
      </span>
    </label>

    <label>
      Tags
      <span class="recipe-editor__mixed" hidden>* MIXED</span>
      <span class="recipe-editor__field-control">
        <input name="tags" type="text" placeholder="Chocolate, Sweet" />
        <button
          type="button"
          class="recipe-editor__bulk-field-save"
          data-field="tags"
          aria-label="Save tags to all selected recipes"
          hidden
        >
          Save
        </button>
      </span>
    </label>

    <div class="recipe-editor__numeric">
      <label>
        Makes
        <span class="recipe-editor__mixed" hidden>* MIXED</span>
        <span class="recipe-editor__field-control">
          <input name="makes" type="number" step="1" placeholder="0" />
          <button
            type="button"
            class="recipe-editor__bulk-field-save"
            data-field="makes"
            aria-label="Save makes to all selected recipes"
            hidden
          >
            Save
          </button>
        </span>
      </label>

      <label>
        Difficulty
        <span class="recipe-editor__mixed" hidden>* MIXED</span>
        <span class="recipe-editor__field-control">
          <input name="difficulty" type="number" step="any" placeholder="5" />
          <button
            type="button"
            class="recipe-editor__bulk-field-save"
            data-field="difficulty"
            aria-label="Save difficulty to all selected recipes"
            hidden
          >
            Save
          </button>
        </span>
      </label>
    </div>

    <label class="recipe-editor__checkbox">
      <span class="recipe-editor__field-control">
        <input name="archived" type="checkbox" />
        <span>Archived</span>
        <span class="recipe-editor__mixed" hidden>* MIXED</span>
        <button
          type="button"
          class="recipe-editor__bulk-field-save"
          data-field="archived"
          aria-label="Save archived to all selected recipes"
          hidden
        >
          Save
        </button>
      </span>
    </label>
  </fieldset>
</details>
