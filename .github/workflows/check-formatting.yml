name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# Cancel superseded runs on the same ref; keep main-branch runs independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-formatting:
    name: Check Formatting
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macOS, labels: [self-hosted, macOS] }
          - { os: Windows, labels: [self-hosted, Windows] }
    runs-on: ${{ matrix.labels }}
    defaults:
      run:
        shell: bash
        working-directory: ./repo
    steps:
      # Full clone: the package version is dynamic (setuptools-scm) and is
      # derived from git tags; mirror-clone/git clone always does a full clone.
      # Clone the repo with mirror-clone when available; fall back to
      # git clone otherwise (or if mirror-clone fails). A full clone is
      # required for the git-tag-derived version checks.
      - name: Clone Repo
        # Job default is ./repo, but ./repo is created by this step.
        working-directory: .
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP:-/tmp}"
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          clone_dir="$GITHUB_WORKSPACE/repo"
          rm -rf "$clone_dir"
          mkdir -p "$clone_dir"
          if command -v mirror-clone >/dev/null 2>&1; then
            echo "using mirror-clone"
            mirror-clone --branch "$branch" \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              "$clone_dir" || {
                echo "mirror-clone failed; falling back to git clone"
                rm -rf "$clone_dir"
                mkdir -p "$clone_dir"
                git clone --branch "$branch" \
                  "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
                  "$clone_dir"
              }
          else
            echo "mirror-clone not installed; using git clone"
            git clone --branch "$branch" \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              "$clone_dir"
          fi

      # uv for the Python side (black, formattington via uv run). uv also
      # fetches CPython 3.14 on first use.
      - uses: astral-sh/setup-uv@v7

      # node + pnpm for the PATH-only formatter CLIs (prettier).
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # prettier (pnpm) — matches the PATH-only requirement in scripts/format.sh.
      - name: Install pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10 --activate

      - name: Install prettier
        shell: bash
        run: |
          set -euo pipefail
          PNPM_HOME="$HOME/pnpm"
          mkdir -p "$PNPM_HOME"
          export PATH="$PNPM_HOME:$PATH"
          pnpm config set global-bin-dir "$PNPM_HOME"
          pnpm add --global prettier
          echo "$PNPM_HOME" >> "$GITHUB_PATH"

      # taplo + shfmt — pinned releases, installed into a scratch bin dir.
      # Windows x64 and macOS x64/arm64 only (Linux runners are out of scope
      # for now).
      - name: Install taplo and shfmt
        shell: bash
        run: |
          set -euo pipefail
          bin_dir="$RUNNER_TEMP/fmt-bin"
          mkdir -p "$bin_dir"
          case "$(uname -s)-$(uname -m)" in
            Darwin-x86_64)                 t=taplo-darwin-x86_64; s=shfmt_v3.14.1_darwin_amd64 ;;
            Darwin-arm64)                  t=taplo-darwin-aarch64; s=shfmt_v3.14.1_darwin_arm64 ;;
            Linux-x86_64)                  t=taplo-linux-x86_64;  s=shfmt_v3.14.1_linux_amd64 ;;
            Linux-aarch64|Linux-arm64)     t=taplo-linux-aarch64; s=shfmt_v3.14.1_linux_arm64 ;;
            MINGW*-x86_64|MSYS*-x86_64|CYGWIN*-x86_64) t=taplo-windows-x86_64; s=shfmt_v3.14.1_windows_amd64.exe ;;
            MINGW*-aarch64|MSYS*-aarch64|CYGWIN*-aarch64|*arm64)   t=taplo-windows-aarch64; s=shfmt_v3.14.1_windows_amd64.exe ;;
            *) echo "unsupported platform: $(uname -s) $(uname -m)" >&2; exit 2 ;;
          esac
          curl -fsSL "https://github.com/tamasfe/taplo/releases/download/0.10.0/$t.gz" | gunzip > "$bin_dir/taplo"
          curl -fsSL "https://github.com/mvdan/sh/releases/download/v3.14.1/$s" -o "$bin_dir/shfmt"
          chmod +x "$bin_dir/taplo" "$bin_dir/shfmt"
          echo "$bin_dir" >> "$GITHUB_PATH"

      - name: Tool versions
        shell: bash
        run: |
          uv --version
          prettier --version
          taplo --version
          shfmt --version

      # Requires uv, bash, prettier, shfmt, and taplo (all installed above).
      # Exits non-zero when anything is unformatted.
      - name: Run formattington format check
        shell: bash
        run: ./scripts/format.sh --check

  test:
    name: Test (${{ matrix.os }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macOS, labels: [self-hosted, macOS] }
          - { os: Windows, labels: [self-hosted, Windows] }
    runs-on: ${{ matrix.labels }}
    defaults:
      run:
        shell: bash
        working-directory: ./repo
    steps:
      # Full clone: the package version is dynamic (setuptools-scm) and is
      # derived from git tags; mirror-clone/git clone always does a full clone.
      # Clone the repo with mirror-clone when available; fall back to
      # git clone otherwise (or if mirror-clone fails). A full clone is
      # required for the git-tag-derived version checks.
      - name: Clone Repo
        # Job default is ./repo, but ./repo is created by this step.
        working-directory: .
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP:-/tmp}"
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          clone_dir="$GITHUB_WORKSPACE/repo"
          rm -rf "$clone_dir"
          mkdir -p "$clone_dir"
          if command -v mirror-clone >/dev/null 2>&1; then
            echo "using mirror-clone"
            mirror-clone --branch "$branch" \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              "$clone_dir" || {
                echo "mirror-clone failed; falling back to git clone"
                rm -rf "$clone_dir"
                mkdir -p "$clone_dir"
                git clone --branch "$branch" \
                  "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
                  "$clone_dir"
              }
          else
            echo "mirror-clone not installed; using git clone"
            git clone --branch "$branch" \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              "$clone_dir"
          fi

      # uv for Python + dev dependencies (pytest via dependency-groups).
      - uses: astral-sh/setup-uv@v7

      # Chrome for Testing + the matching chromedriver power the Selenium
      # browser tests under test/e2e. They run headless in CI.
      - name: Setup Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          install-chromedriver: true

      - name: Install dependencies
        shell: bash
        run: uv sync --locked --group dev

      - name: Run pytest
        shell: bash
        env:
          RECIPE_SERVER_TEST_HEADLESS: "1"
          RECIPE_SERVER_TEST_CHROME_BINARY: ${{ steps.setup-chrome.outputs.chrome-path }}
          RECIPE_SERVER_TEST_CHROMEDRIVER: ${{ steps.setup-chrome.outputs.chromedriver-path }}
        run: uv run pytest

      # Screenshots and browser console logs captured on test failure.
      - name: Upload e2e failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts-${{ matrix.os }}
          path: repo/.e2e-artifacts/
          if-no-files-found: ignore
