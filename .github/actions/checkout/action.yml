name: Checkout
description: Clone the repository into the working directory. Uses the PR ref GITHUB_HEAD_REF if available, otherwise fallback to GITHUB_REF_NAME.

inputs:
  working_directory:
    required: true
    description: Working directory
  token:
    required: true
    description: GitHub token for authentication

runs:
  using: composite

  steps:
    - name: Clone Repo
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        directory="${{ inputs.working_directory }}"

        # Refuse to operate on an empty path or filesystem root.
        if [[ -z "$directory" || "$directory" == "/" ]]; then
          echo "ERROR: Refusing to clone to unsafe directory: '$directory'" >&2
          exit 1
        fi

        echo "Cloning ${GITHUB_REPOSITORY} to: $directory"
        rm -rf -- "$directory"
        mkdir -p -- "$(dirname -- "$directory")"
        branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
        git clone --branch "$branch" "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$directory"
