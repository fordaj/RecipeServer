name: Checks
description: Repository checks (format + tests).

inputs:
  working_directory:
    required: true
    description: Working directory

runs:
  using: composite
  steps:
    - name: Format
      shell: bash
      run: |
        cd "${{ inputs.working_directory }}"
        source scripts/env.sh
        ./format.sh --check

    - name: Test
      shell: bash
      run: |
        cd "${{ inputs.working_directory }}"
        source scripts/env.sh
        uv run pytest
