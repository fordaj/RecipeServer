name: Cleanup

description: Clean up the working directory.

inputs:
  working_directory:
    required: true
    description: Working directory

runs:
  using: composite

  steps:
    - name: Remove directory if it exists
      shell: bash
      run: |
        set -euo pipefail
        directory="${{ inputs.working_directory }}"

        # Refuse to operate on an empty path or filesystem root.
        if [[ -z "$directory" || "$directory" == "/" ]]; then
          echo "ERROR: Refusing to remove unsafe directory: '$directory'" >&2
          exit 1
        fi

        # Require the directory to exist before attempting removal.
        if [[ ! -d "$directory" ]]; then
          echo "Directory does not exist, nothing to clean: $directory"
          exit 0
        fi

        echo "Removing directory: $directory"
        rm -rf -- "$directory"
